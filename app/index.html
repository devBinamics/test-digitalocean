<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hola mundo</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1115; --card: #181b22; --text: #e6e8ec; --muted: #9aa3b2; --accent: #60a5fa; }
  }
  :root[data-theme="dark"] { --bg: #0f1115; --card: #181b22; --text: #e6e8ec; --muted: #9aa3b2; --accent: #60a5fa; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, sans-serif; }
  .card { background: var(--card); border: 1px solid var(--border, #d9dde5); border-radius: 12px; padding: 32px; text-align: center; max-width: 420px; width: 100%; }
  h1 { color: var(--accent); margin: 0 0 12px; font-size: 32px; }
  p { color: var(--muted); margin: 8px 0; }
  button { margin-top: 16px; font: inherit; padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  #resp { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <h1>Hola mundo</h1>
  <p>SPA servida desde <code>/app</code></p>
  <button id="btn">Llamar a /api/hello</button>
  <p id="resp"></p>
</div>
<script>
  document.getElementById("btn").addEventListener("click", async () => {
    const out = document.getElementById("resp");
    out.textContent = "Llamando…";
    try {
      const res = await fetch("/api/hello");
      const data = await res.json();
      out.textContent = `${res.status} · ${data.message} · ${data.time}`;
    } catch (err) {
      out.textContent = "Error: " + err.message;
    }
  });
</script>
</body>
</html>
